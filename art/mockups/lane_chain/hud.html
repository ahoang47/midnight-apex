<html><head><style>
body{margin:0;width:1600px;height:900px;background:url(entry_scene.png);font-family:"DejaVu Sans",sans-serif;color:#fff;position:relative}
.panel{position:absolute;right:40px;top:200px;width:430px;background:rgba(23,23,23,.9);border:1px solid #a3a3a3;border-radius:6px;padding:18px;box-shadow:0 8px 24px #000}
.hdr{display:flex;justify-content:space-between;color:#a3a3a3;font-size:14px;font-weight:bold;letter-spacing:1px;margin-bottom:12px}
.call{display:flex;align-items:center;justify-content:space-between;border-radius:6px;padding:13px 14px;margin-bottom:9px;font-weight:bold;font-size:18px;border:1px solid}
.atk{background:#dc2626;border-color:#b91c1c}.def{background:#16a34a;border-color:#15803d}.stdy{background:#eab308;border-color:#ca8a04}
.tag{font-size:13px;padding:3px 8px;border-radius:4px;background:rgba(0,0,0,.35)}
.off{background:#262626!important;border-color:#404040!important;color:#737373}
.off .tag{background:#0a0a0a;color:#ef4444;border:1px solid #7f1d1d}
.sel{outline:3px solid #67e8f9;outline-offset:2px}
.steps{display:flex;gap:8px;margin-bottom:14px}.steps div{flex:1;text-align:center;padding:6px;border-radius:4px;background:#262626;color:#737373;font-size:13px;font-weight:bold}
.steps .done{color:#67e8f9;border:1px solid #155e75}.steps .now{background:#e5e5e5;color:#111}
.note{color:#737373;font-size:12px;margin-top:6px}
</style></head><body>
<div class="panel">
 <div class="steps"><div class="done">ENTRY · OUTSIDE</div><div class="now">APEX</div><div>EXIT</div></div>
 <div class="hdr"><span>APEX CALL</span><span>DRAWN: POW 2 · EN 1 · HAN 0</span></div>
 <div class="call atk sel"><span>Late brake, dive inside</span><span class="tag">POW</span></div>
 <div class="call def"><span>Hold the inside, cover</span><span class="tag">EN</span></div>
 <div class="call stdy off"><span>Trail-brake, late apex</span><span class="tag">HAN · none drawn</span></div>
 <div class="note">Placeholder call wording; Nathaniel to write the real lines.</div>
</div>
</body></html>
