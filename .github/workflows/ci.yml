name: CI

on:
  push:
    branches: [master, touge-race]
  pull_request:
    branches: [master, touge-race]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    name: sim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Unit and integration tests
        run: python -m pytest tests/ -q --tb=short
      - name: Progression report (default order)
        run: python scripts/run_progression.py
      - name: Balance gauntlet
        run: python scripts/balance_gauntlet.py

  # The Godot job ran the two-corner prototype under unapproved/gordon/two-corner/, which is not on master.
  # Gordon re-adds Godot steps for the main project when the build starts (2026-11-14).
